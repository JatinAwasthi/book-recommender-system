<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Book Recommender</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap"
          rel="stylesheet">

<style>

:root {
    --cream: #f5f0e8;
    --warm: #ede8dc;
    --ink: #1a1814;
    --accent: #7c4dff;
    --accent-dark: #5e35d5;
    --muted: #9a9488;
}

body {
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    margin: 0;
}

/* NAVBAR */

.navbar{
    background:linear-gradient(
        90deg,
        #6a3df0 0%,
        #7c4dff 50%,
        #8e67ff 100%
    ) !important;

    border:none;
    border-radius:0;
    min-height:78px;

    display:flex;
    align-items:center;

    padding:0 40px;

    margin-bottom:0;

    box-shadow:0 4px 22px rgba(124,77,255,.25);
}

.navbar-brand{

    color:white !important;

    font-family:'Cormorant Garamond',serif;

    font-size:34px;

    font-weight:700;

    display:flex;

    align-items:center;

    height:78px;

    padding:0 !important;

    animation:logoGlow 2.5s ease infinite alternate;
}

.navbar-nav {

    margin-left: auto !important;

    display: flex;
    align-items: center;

    height: 78px;
}

.navbar-nav>li>a{

    color:rgba(255,255,255,.9) !important;

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:2px;

    height:78px;

    display:flex;

    align-items:center;

    padding:0 18px !important;

    transition:.3s;

    outline:none !important;
}

.navbar-nav>li>a:hover{

    background:transparent !important;

    color:white !important;

    transform:translateY(-3px);
}
.navbar-nav>li>a:focus,
.navbar-nav>li>a:active{

    background:transparent !important;

    color:white !important;

    outline:none !important;

    box-shadow:none !important;
}

/* HERO */

.hero {

    background:
            linear-gradient(
                    160deg,
                    #ffffff 0%,
                    #f0eaff 100%
            );

    padding: 70px 0 60px;

    position: relative;

    overflow: hidden;
}

.hero::after {

    content: '✦';

    position: absolute;

    right: 7%;
    top: 50%;

    transform: translateY(-50%);

    font-size: 220px;

    color: rgba(124,77,255,0.05);
}

.hero h1 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 72px;

    font-weight: 700;

    color: #1a1814;

    animation: fadeUp 0.8s ease;
}

.hero h1 em {

    color: var(--accent);

    font-style: italic;
}

.divider {

    width: 50px;

    height: 2px;

    background: var(--accent);

    margin: 20px 0;
}

/* CARDS */

.books-section {

    padding: 50px 0 80px;
}

.row {

    display: flex;

    flex-wrap: wrap;
}

.row > [class*='col-'] {

    display: flex;

    margin-bottom: 30px;
}

.card {

    width: 100%;

    border: none;

    border-radius: 16px;

    overflow: hidden;

    background: white;

    box-shadow:
            0 4px 20px rgba(0,0,0,0.08);

    transition: 0.35s ease;
}

.card:hover {

    transform:
            translateY(-8px)
            scale(1.02);

    box-shadow:
            0 20px 45px rgba(124,77,255,0.18);
}

.card-img-top {

    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    transition: 0.45s ease;
}

.card:hover .card-img-top {

    transform: scale(1.06);
}

.card-text-area {

    padding: 18px;
}

.card h2 {

    font-family: 'Cormorant Garamond', serif;

    font-size: 20px;

    font-weight: 700;

    color: #1a1814;
}

.card h4 {

    font-size: 11px;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color: var(--accent);
}

.card-stats {

    display: flex;

    gap: 20px;

    margin-top: 12px;
}

.card-stats p {

    color: #888;
}

.card-stats span {

    display: block;

    color: #1a1814;

    font-weight: 600;
}

@keyframes fadeUp {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes logoFade {

    from {
        opacity: 0;
        transform: translateY(-10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

</style>

</head>

<body>

<nav class="navbar">

    <a class="navbar-brand">
        My Book Recommender
    </a>

    <ul class="nav navbar-nav">

        <li><a href="/">Home</a></li>

        <li><a href="/recommend">Recommend</a></li>

    </ul>

</nav>

<div class="hero">

    <div class="container">

        <h1>Top <em>50</em> Books</h1>

        <div class="divider"></div>

    </div>

</div>

<div class="books-section">

    <div class="container">

        <div class="row">

            {% for i in range(book_name|length) %}

            <div class="col-md-3">

                <div class="card">

                    <img class="card-img-top"
                         src="{{image[i]}}">

                    <div class="card-text-area">

                        <h2>{{book_name[i]}}</h2>

                        <h4>{{author[i]}}</h4>

                        <div class="card-stats">

                            <p>
                                Votes
                                <span>{{votes[i]}}</span>
                            </p>

                            <p>
                                Rating
                                <span>{{ '%.3f'|format(ratings[i]) }}</span>
                            </p>

                        </div>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</div>

</body>

</html>
